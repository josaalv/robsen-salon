name: Deploy Preview to Hostinger

# Entorno de pruebas en /preview/ — mismo dominio, misma cuenta de Supabase,
# pero schema 'preview' (clon aislado de 'public') y storage local con
# sufijo aparte. Ver docs/DEPLOY.md. Nunca toca la rama main ni el deploy
# de producción.
on:
  push:
    branches: [preview]

concurrency:
  group: hostinger-deploy-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SCHEMA: preview
          VITE_STORAGE_SUFFIX: _preview
          VITE_BASE_PATH: /preview/

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir a Hostinger por FTP (lftp mirror) — subcarpeta /preview/
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 2
          set mirror:parallel-transfer-count 3
          mkdir -p ./preview
          mirror --reverse --verbose ./dist/ ./preview/
          bye
          EOF
