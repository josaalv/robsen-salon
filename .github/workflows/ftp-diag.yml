name: Diagnóstico FTP (temporal)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Listar árbol real del servidor FTP
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        timeout-minutes: 3
        run: |
          OPTS="set ssl:verify-certificate no; set ftp:ssl-allow no; set net:timeout 15; set net:max-retries 1;"

          echo "=== pwd al conectar ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS pwd; bye" 2>&1 || true

          echo ""
          echo "=== ls de la raíz (sin recursión) ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS cls -la --file-facts; bye" 2>&1 || true

          echo ""
          echo "=== ls de assets/ si existe ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS cls -la assets/ ; bye" 2>&1 || true

          echo ""
          echo "=== contenido de index.html real ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS cat index.html; bye" 2>&1 || true

          echo ""
          echo "=== ¿existe deploy-test.txt aquí? ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS cat deploy-test.txt; bye" 2>&1 || true
