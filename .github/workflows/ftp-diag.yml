name: Diagnóstico FTP (temporal)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Listar árbol real del servidor FTP
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          OPTS="set ssl:verify-certificate no; set ftp:ssl-allow no;"

          echo "=== pwd al conectar ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS pwd; bye" 2>&1 || true

          echo ""
          echo "=== ls de la raíz ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS ls -la; bye" 2>&1 || true

          echo ""
          echo "=== árbol recursivo (2 niveles) desde la raíz ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" -e "$OPTS find -d 2 . ; bye" 2>&1 || true
