name: Diagnóstico FTP temporal (borrar después de usar)

on:
  push:
    paths:
      - '.github/workflows/diag-ftp-temp.yml'

jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Explorar estructura de directorios de la cuenta
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 2
          echo "--- raíz de la cuenta ---"
          cls -1 .
          echo "--- domains/ (si existe) ---"
          cls -1 domains 2>/dev/null || echo "(no existe domains/)"
          echo "--- domains/robsen.com.mx/ (si existe) ---"
          cls -1 domains/robsen.com.mx 2>/dev/null || echo "(no existe)"
          echo "--- domains/robsen.com.mx/public_html/ (si existe) ---"
          cls -1 domains/robsen.com.mx/public_html 2>/dev/null || echo "(no existe)"
          bye
          EOF
