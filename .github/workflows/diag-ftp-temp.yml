name: Diagnóstico FTP temporal (borrar después de usar)

on:
  push:
    paths:
      - '.github/workflows/diag-ftp-temp.yml'

jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Explorar la cuenta FTP de robsen.com.mx
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.ROBSEN_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.ROBSEN_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 2
          set cmd:fail-exit no
          echo "--- raíz de la cuenta (u796891002) ---"
          cls -1 .
          echo "--- public_html/ (si existe ahí) ---"
          cls -1 public_html
          echo "--- domains/ (si existe) ---"
          cls -1 domains
          bye
          EOF
